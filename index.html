<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <div class="container mt-2">
    <nav class="navbar bg-primary" data-bs-theme="light">
      <div class="container-fluid">
        <a class="navbar-brand">Navbar</a>
        <div class="d-flex">
          <input id="email-sign" type="text" placeholder="Usuario" class="form-control me-2">
          <input id="password-sign" type="password" placeholder="Contraseña" class="form-control me-2">
          
          <button id="btnLogin" class="btn btn-success btn-sm">Ingreso</button>
          <button class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#exampleModal">Registro</button>
        </div>
      </div>
    </nav>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Registro de usuarios</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input id="email-register" type="text" placeholder="Usuario" class="form-control me-2">
          <div class="mt-2"></div>
          <input id="password-register" type="password" placeholder="Contraseña" class="form-control me-2">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button id="btnRegistrar" type="button" class="btn btn-primary">Guardar</button>
        </div>
      </div>
    </div>
  </div>
  
  <div id="contenido"></div>
  <script type="module" src="firebaseBackend/firebase.js"></script>
  <script type="module" src="firebaseBackend/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
